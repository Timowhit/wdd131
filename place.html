<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Place title</title>
    <meta name="author" content="Timothy Whitehead">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="title-box">
            <h1>Okinawa, Japan</h1>
        </div>
    </header>
    
    <main class="main-content">
        <div class="large-image">
            <img src="images/okinawa.webp" 
             srcset="images/okinawa.webp 400w,
                 images/okinawa.webp 800w,
                 images/okinawa.webp 1200w"
             sizes="(max-width: 400px) 400px,
                (max-width: 800px) 800px,
                1200px"
             alt="Scenic view of Okinawa coastline" 
             style="width: 100%; height: 100%; object-fit: cover;">
        </div>

        <div class="data-panel">
            <h3>Data</h3>
            <div class="data-item">
                <span>Label:</span>
                <span>Value</span>
            </div>
            <div class="data-item">
                <span>Label:</span>
                <span>Value</span>
            </div>
            <div class="data-item">
                <span>Label:</span>
                <span>Value</span>
            </div>
            <div class="data-item">
                <span>Label:</span>
                <span>Value</span>
            </div>
        </div>

        <div class="weather-panel">
            <div class="weather-header">
                <h3>Weather</h3>
                <img src="images/weathericon.svg" alt="Weather icon" class="weather-icon">
            </div>
            <div class="data-item">
                <span>Temperature:</span>
                <span>46°F</span>
            </div>
            <div class="data-item">
                <span>Wind Speed:</span>
                <span>10 mph</span>
            </div>
            <div class="data-item">
                <span>Wind Chill:</span>
                <span id="windchill">N/A</span>
            </div>
            <div class="data-item">
                <span>Conditions:</span>
                <span>Partly Cloudy</span>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <div class="footer-line">
            &copy;<span id="currentyear"></span> Timothy Whitehead - Arizona, USA
        </div>
        <div class="footer-line">
            Last Updated: <span id="lastmodified"></span>
        </div>
    </footer>                  
</body>
</html>
