    <script>
        function loadStylesheetForDevice() {
            const head = document.head;
            const link = document.createElement('link');
            link.rel = 'stylesheet';

            if (window.innerWidth < 768) {
                link.href = 'styles/temples.css';
                const script = document.createElement('script');
                script.src = 'scripts/temples.js';
                script.defer = true;
                head.appendChild(script);
            }
            else {
                link.href = 'styles/temples-large.css';
            }

            const existingLink = document.querySelector('link[rel="stylesheet"]');
            if (existingLink) {
                head.removeChild(existingLink);
            }
            head.appendChild(link);
        }

        window.onload = loadStylesheetForDevice;
        window.onresize = loadStylesheetForDevice;

        function setupHamburgerMenu() {
            if (window.innerWidth < 768) {
                let nav = document.querySelector('nav');
                if (!document.getElementById('hamburger')) {
                    const hamburger = document.createElement('button');
                    hamburger.id = 'hamburger';
                    hamburger.innerHTML = '&#9776;';
                    hamburger.setAttribute('aria-label', 'Open navigation menu');
                    nav.parentNode.insertBefore(hamburger, nav);

                    nav.style.display = 'none';

                    hamburger.onclick = function () {
                        nav.style.display = nav.style.display === 'none' ? 'block' : 'none';
                    };
                }
            } else {
                const hamburger = document.getElementById('hamburger');
                let nav = document.querySelector('nav');
                if (hamburger) {
                    hamburger.parentNode.removeChild(hamburger);
                }
                if (nav) {
                    nav.style.display = '';
                }
            }
        }
        window.addEventListener('load', setupHamburgerMenu);
        window.addEventListener('resize', setupHamburgerMenu);
    </script>
